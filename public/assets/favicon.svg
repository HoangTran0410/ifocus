<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Dark glass panel background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Bright teal-cyan ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Glow filter for rings -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="7" ry="7" fill="url(#bgGrad)"/>

  <!-- Outer ring — soft glow -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.45" filter="url(#glow)"/>

  <!-- Middle ring -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.75" filter="url(#glow)"/>

  <!-- Inner ring -->
  <circle cx="16" cy="16" r="4" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.95" filter="url(#glow)"/>

  <!-- Center dot — bright focal point -->
  <circle cx="16" cy="16" r="1.8" fill="#5eead4"/>
</svg>